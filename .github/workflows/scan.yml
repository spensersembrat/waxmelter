name: Hourly scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Wax Melter scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/scan" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
